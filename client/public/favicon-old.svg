<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Plate -->
  <circle cx="16" cy="18" r="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Food items on plate -->
  <!-- Main dish (protein) -->
  <ellipse cx="14" cy="16" rx="2.5" ry="1.5" fill="#dc2626"/>
  
  <!-- Side dish (vegetables) -->
  <ellipse cx="18" cy="17" rx="1.5" ry="1" fill="#16a34a"/>
  <ellipse cx="17" cy="19" rx="1" ry="0.8" fill="#eab308"/>
  
  <!-- Utensils -->
  <!-- Fork -->
  <line x1="8" y1="8" x2="10" y2="12" stroke="#6b7280" stroke-width="1" stroke-linecap="round"/>
  <line x1="7.5" y1="8" x2="9.5" y2="12" stroke="#6b7280" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="8.5" y1="8" x2="10.5" y2="12" stroke="#6b7280" stroke-width="0.5" stroke-linecap="round"/>
  
  <!-- Knife -->
  <line x1="24" y1="8" x2="22" y2="12" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="8" x2="22.5" y2="9" stroke="#6b7280" stroke-width="0.8" stroke-linecap="round"/>
</svg>